# Conda environment for high energy physics work.
# Everything here is a prebuilt package from conda-forge.
# GENIE, OscProb, Prob3++ and the optional extras are not on conda-forge;
# the scripts in scripts/ compile them inside this environment.
# A few Python packages that are only on PyPI are installed with pip (bottom).

name: hep
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12

  # Core HEP software
  - root
  - geant4
  - pythia8
  - lhapdf

  # Needed to compile GENIE
  - c-compiler
  - cxx-compiler
  - fortran-compiler     # for CORSIKA 8, APFEL, CRMC and NuWro (Pythia 6)
  - wget
  - make
  - perl
  - git
  - gsl
  - log4cpp
  - libxml2-devel

  # Needed to build your own Geant4 applications
  - cmake
  - expat
  - freetype
  - zlib
  - qt6-main
  - xorg-libx11
  - xorg-libxmu

  # Needed to build OscProb (tested upstream with Eigen 3.4)
  - eigen=3.4

  # Needed only for the optional extras (bash install.sh --with ...)
  - conan                # CORSIKA 8
  - git-lfs              # CORSIKA 8
  - libboost-devel       # gSeaGen, CRMC, LeptonInjector
  - libboost-python-devel  # LeptonInjector Python module (Prometheus)
  - tbb-devel            # gSeaGen (ROOT's link flags include -ltbb)
  - hepmc3               # CRMC event output
  - photospline          # LeptonInjector, LeptonWeighter (Prometheus)
  - libopenblas          # photospline links libopenblas.so.0 but does not pull it in
  - pybind11             # LeptonInjector, LeptonWeighter (Prometheus)
  - scikit-build-core    # LeptonWeighter (Prometheus)
  - hdf5                 # LeptonInjector, LeptonWeighter (Prometheus)

  # Data formats
  - pyarrow              # Apache Parquet (also used by Prometheus and CORSIKA 8 output)
  - yaml-cpp
  - h5py
  - pyyaml
  - tqdm

  # Machine learning
  - scikit-learn         # logistic regression, MLP and other classic models
  - xgboost              # gradient-boosted trees
  - pytorch              # neural networks, including CNNs
  - torchvision          # image models and CNN building blocks for PyTorch
  - pytorch_geometric    # graph neural networks (PyG)
  - jax                  # used by Fennel, Hyperion and Prometheus
  - jaxlib
  - optax

  # Python analysis stack (Scikit-HEP and friends)
  - numpy
  - scipy
  - pandas
  - matplotlib
  - jupyterlab
  - uproot
  - awkward
  - hist
  - mplhep
  - iminuit
  - vector
  - particle

  # Python packages only available on PyPI
  - pip
  - pip:
      - MCEq                # atmospheric lepton fluxes (Matrix Cascade Equations)
      - chromo              # EPOS, QGSJet, Sibyll, DPMJET, Pythia and UrQMD from Python
      - fennel_seed @ https://github.com/MeighenBergerS/fennel/archive/refs/tags/v2.1.0.tar.gz   # light yields (Prometheus uses v2.1.0)
