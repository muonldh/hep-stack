# Conda environment for high energy physics work.
# Everything here is a prebuilt package from conda-forge.
# GENIE, OscProb, Prob3++ and the optional extras are not on conda-forge;
# the scripts in scripts/ compile them inside this environment.

name: hep
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12

  # Core HEP software
  - root
  - geant4
  - pythia8
  - lhapdf

  # Needed to compile GENIE
  - c-compiler
  - cxx-compiler
  - fortran-compiler     # for CORSIKA 7, CORSIKA 8 and APFEL
  - wget
  - make
  - perl
  - git
  - gsl
  - log4cpp
  - libxml2-devel

  # Needed to build your own Geant4 applications
  - cmake
  - expat
  - freetype
  - zlib
  - qt6-main
  - xorg-libx11
  - xorg-libxmu

  # Needed to build OscProb (tested upstream with Eigen 3.4)
  - eigen=3.4

  # Needed only for the optional extras (bash install.sh --with ...)
  - conan                # CORSIKA 8
  - git-lfs              # CORSIKA 8
  - libboost-devel       # gSeaGen
  - tbb-devel            # gSeaGen (ROOT's link flags include -ltbb)

  # Python analysis stack (Scikit-HEP and friends)
  - numpy
  - scipy
  - pandas
  - matplotlib
  - jupyterlab
  - uproot
  - awkward
  - hist
  - mplhep
  - iminuit
  - vector
  - particle
